plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenLocal()
    flatDir {
        dirs 'libs'
    }
    // maven {
    //     name = "LocalRepo"
    //     allowInsecureProtocol = true
    //     url = uri("http://192.168.2.223:8081/repository/maven-public")
    // }
    maven {
        url = uri("https://maven.pkg.github.com/An-Mao/JavaDevCore")
        credentials {
            username = "An-Mao"
            password = System.getenv("GITHUB_TOKEN") ?: "ghp_" + System.getenv("GTT")
        }
    }
    maven {
        url = uri("https://maven.pkg.github.com/An-Mao/GraalJS")
        credentials {
            username = "An-Mao"
            password = System.getenv("GITHUB_TOKEN") ?: "ghp_" + System.getenv("GTT")
        }
    }
    maven {
        name = "AnYeRepo"
        allowInsecureProtocol = true
        url = uri("https://maven.anye.dev/repository/maven-public")
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

configurations {
    libraries
    implementation.extendsFrom libraries
}

runs {
    configureEach {
        dependencies {
            runtime project.configurations.libraries
        }
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        systemProperty 'forge.logging.console.level', 'debug'

        workingDirectory project.layout.projectDirectory.dir('run').dir(name)

        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    clientData {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly "org.openjdk.nashorn:nashorn-core:15.4"
    compileOnly "net.java.dev.jna:jna-platform:5.15.0"
    libraries jarJar("dev.anye:core:[$core_version,)")
    compileOnly "dev.anye.mc:graaljs:26.x-25.0.2-1-Neo:all"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            core_version           : core_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
